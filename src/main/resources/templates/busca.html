<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acervo de Partituras</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>𝄞</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">

    <script th:inline="javascript">
        const ARVORE_PASTAS = /*[[${arvorePastas}]]*/ [];
        const PASTA_SELECIONADA_ID = /*[[${pastaSelecionadaId}]]*/ '';
    </script>

    <link rel="stylesheet" th:href="@{/css/busca.css}">
</head>
<body>

    <div class="app-layout">

        <!-- ===== SIDEBAR ===== -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a class="brand" href="/busca">
                    <span class="brand-clef">𝄞</span>
                    <span class="brand-name">Acervo</span>
                </a>
                <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" title="Recolher pastas" aria-label="Recolher pastas">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
                </button>
            </div>

            <nav class="sidebar-folders" id="folderTree">
                <div class="folder-root" th:classappend="${pastaSelecionadaId == raizId and termoBuscado == null} ? 'active'">
                    <a href="/busca">Todas as pastas</a>
                </div>
                <!-- JS renderiza as subpastas aqui -->
            </nav>

        </aside>

        <button class="sidebar-open-handle" id="sidebarOpenHandle" title="Mostrar pastas" aria-label="Mostrar pastas">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>

        <!-- ===== CONTEÚDO ===== -->
        <main class="content">

            <header class="content-header">
                <p class="eyebrow" th:text="${termoBuscado != null} ? 'Busca' : 'Pasta'">Pasta</p>
                <h1 class="content-title" th:if="${termoBuscado == null}" th:text="${nomePasta}">Todas as pastas</h1>
                <h1 class="content-title" th:if="${termoBuscado != null}">
                    &ldquo;<span th:text="${termoBuscado}">termo</span>&rdquo;
                </h1>
                <div class="staff" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
            </header>

            <form class="search" th:action="@{/busca}" method="get" role="search">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <input type="search" name="termo" th:value="${termoBuscado}" placeholder="Buscar partitura, compositor, título…" autocomplete="off" autofocus />
                <button type="submit">Buscar</button>
            </form>

            <div class="alerta-erro" th:if="${erro != null}" th:text="${erro}">Erro</div>

            <p class="count">
                <span th:text="${#lists.size(partituras)}">0</span>
                <span th:text="${#lists.size(partituras) == 1} ? 'partitura' : 'partituras'">partituras</span>
            </p>

            <ol class="lista">
                <li th:each="arquivo : ${partituras}">
                    <a class="item" th:href="${arquivo.link()}" target="_blank" rel="noopener noreferrer">
                        <span class="item-note" aria-hidden="true">♪</span>
                        <span class="item-name" th:text="${arquivo.nome}">Nome da Partitura</span>
                        <span class="item-open">Abrir ↗</span>
                    </a>
                </li>
            </ol>

            <div class="empty-state" th:if="${#lists.isEmpty(partituras)}">
                <div class="empty-rest" aria-hidden="true">𝄽</div>
                <h3>Nenhuma partitura por aqui</h3>
                <p>Tente outro termo ou escolha uma pasta ao lado.</p>
            </div>

        </main>
    </div>

    <script th:src="@{/js/busca.js}"></script>

</body>
</html>
