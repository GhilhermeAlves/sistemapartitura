spring.application.name=sistema-partituras

# ID da pasta raiz do acervo no Google Drive
partituras.folder-id=${PARTITURAS_FOLDER_ID:1BwFnb28EgRYPak9W_N2iXuPjg-wqxrXX}

# Caminho do JSON da service account (FORA do jar). Pode ser sobrescrito pela
# variavel de ambiente GOOGLE_APPLICATION_CREDENTIALS.
partituras.credentials-path=${GOOGLE_APPLICATION_CREDENTIALS:config/google-credentials.json}

# Por quanto tempo o retrato do Drive fica em cache antes de ser relido
partituras.cache-ttl=10m

# Expoe apenas o health check do actuator
management.endpoints.web.exposure.include=health

# Porta (o Render define a variavel PORT)
server.port=${PORT:8080}
